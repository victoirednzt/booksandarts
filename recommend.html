<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recommander une œuvre 🌸</title>


    <link rel="stylesheet" href="style.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">


</head>


<body>


    <a href="index.html" class="back-button">
        ← Retour
    </a>



    <main class="recommend-page">


        <form id="recommendForm">





            <label>
                Catégorie
            </label>


            <select id="category">

                <option value="Livre">
                    📚 Livre
                </option>

                <option value="Film">
                    🎬 Film
                </option>

                <option value="Album">
                    🎵 Musique
                </option>

                <option value="Exposition">
                    🖼️ Art
                </option>

            </select>





            <label>
                Titre
            </label>


            <input id="title" placeholder="Titre de l'œuvre" required>





            <label>
                Auteur / Artiste (facultatif)
            </label>


            <input id="author" placeholder="Auteur ou artiste">





            <label>
                Note
            </label>


            <select id="rating">

                <option value="5">
                    ★★★★★
                </option>

                <option value="4.5">
                    ★★★★½
                </option>

                <option value="4">
                    ★★★★
                </option>

                <option value="3.5">
                    ★★★½
                </option>

                <option value="3">
                    ★★★
                </option>

                <option value="2.5">
                    ★★½
                </option>

                <option value="2">
                    ★★
                </option>

                <option value="1">
                    ★
                </option>

            </select>





            <label>
                Recommandation
            </label>


            <textarea id="recommendation" placeholder="donne nous ton avig" required></textarea>





            <label>
                Pseudo
            </label>


            <input id="username" type="text" placeholder="qui es tu (facultatif)">





            <button type="submit">
                Envoyer 🌸
            </button>



        </form>


    </main>




    <script type="module" src="recommend.js"></script>


</body>

</html>
